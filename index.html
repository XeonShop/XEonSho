<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<meta name="description" content="XeonEria ร้านค้าออนไลน์สำหรับสินค้า Roblox และ PES">

<title>XeonEria | ร้านค้า Roblox และ PES</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 90px;
}

body {
    font-family: Arial, Tahoma, sans-serif;
    background: #050505;
    color: white;
}

button, input {
    font: inherit;
}

button {
    cursor: pointer;
}

/* HEADER */
header {
    min-height: 80px;
    background: #080808;
    border-bottom: 2px solid #ffe000;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.navbar {
    width: 1150px;
    max-width: 94%;
    min-height: 78px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #ffe000;
}

.logo-name {
    font-size: 24px;
    font-weight: bold;
    color: #ffe000;
    margin-right: auto;
}

.logo-name span {
    color: #28c8ff;
}

.search-button,
.mobile-menu-button {
    width: 45px;
    height: 45px;
    border: 2px solid #28c8ff;
    border-radius: 10px;
    background: #111;
    color: #28c8ff;
    font-size: 22px;
}

.search-button:hover,
.mobile-menu-button:hover {
    background: #28c8ff;
    color: #000;
}

.mobile-menu-button {
    display: none;
}

.menu {
    display: flex;
    gap: 5px;
}

.menu button {
    border: 0;
    background: transparent;
    color: white;
    padding: 10px;
    font-size: 15px;
    font-weight: bold;
}

.menu button:hover {
    color: #ffe000;
}

/* SEARCH */
.search-box {
    display: none;
    position: absolute;
    right: 3%;
    top: 72px;
    width: 320px;
    max-width: 94vw;
    padding: 12px;
    background: #101010;
    border: 2px solid #28c8ff;
    border-radius: 12px;
    box-shadow: 0 10px 30px #000;
}

.search-box input {
    width: 100%;
    padding: 12px;
    background: #050505;
    border: 1px solid #444;
    border-radius: 8px;
    color: white;
    outline: none;
}

.search-box button {
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    border: 0;
    border-radius: 8px;
    background: #ffe000;
    color: #000;
    font-weight: bold;
}

/* HERO */
.hero {
    width: 1100px;
    max-width: 94%;
    min-height: 330px;
    margin: 35px auto;
    border: 2px solid #28c8ff;
    border-radius: 18px;
    background:
        radial-gradient(circle at 80% 20%, #ffe00025, transparent 30%),
        linear-gradient(120deg, #080808, #111820);
    display: flex;
    align-items: center;
}

.hero-content {
    padding: 45px;
}

.badge {
    display: inline-block;
    padding: 7px 18px;
    margin-bottom: 15px;
    border: 1px solid #ffe000;
    border-radius: 30px;
    color: #ffe000;
    font-weight: bold;
}

.hero h1 {
    font-size: 55px;
    line-height: 1.1;
}

.hero h1 span {
    color: #ffe000;
}

.hero p {
    margin-top: 15px;
    color: #ccc;
    line-height: 1.7;
}

.hero-buttons {
    display: flex;
    gap: 12px;
    margin-top: 25px;
    flex-wrap: wrap;
}

.hero-buttons button {
    padding: 12px 22px;
    border: 0;
    border-radius: 8px;
    font-weight: bold;
}

.yellow { background: #ffe000; color: #000; }
.blue { background: #28c8ff; color: #001018; }
.dark { background: #111; color: white; border: 1px solid #444 !important; }

/* CONTENT */
.container {
    width: 1100px;
    max-width: 94%;
    margin: 40px auto;
}

.title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 12px;
}

.title h2 { font-size: 30px; }
.title span { color: #28c8ff; }

/* CATEGORY */
.cards {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
}

.card {
    background: linear-gradient(180deg, #111, #070707);
    border: 2px solid #ffe000;
    border-radius: 16px;
    text-align: center;
    padding: 25px 15px;
    transition: .2s;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #28c8ff;
}

.icon {
    width: 75px;
    height: 75px;
    margin: 0 auto 15px;
    border: 3px solid #ffe000;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ffe000;
    font-size: 25px;
    font-weight: bold;
}

.game-icon {
    overflow: hidden;
    padding: 0;
}

.game-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.card h3 { font-size: 21px; }
.card p { color: #aaa; margin: 7px 0 15px; }

.card a {
    display: inline-block;
    padding: 9px 18px;
    border-radius: 7px;
    background: #28c8ff;
    color: #001018;
    font-weight: bold;
    text-decoration: none;
}

/* PRODUCTS */
.products {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 18px;
}

.product {
    background: #0d1117;
    border: 1px solid #333;
    border-radius: 13px;
    overflow: hidden;
    transition: .2s;
}

.product:hover {
    transform: translateY(-4px);
    border-color: #28c8ff;
}

.product-img {
    width: 100%;
    height: 180px;
    background: #080b0f;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    cursor: pointer;
}

.product-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s;
}

.product-img:hover img {
    transform: scale(1.05);
}

.product-info { padding: 15px; }
.product-info h3 { font-size: 21px; }
.product-info p { color: #999; margin-top: 5px; }

.price {
    color: #ffe000;
    font-size: 19px;
    font-weight: bold;
    margin-top: 8px;
}

.detail-button {
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    border: 0;
    border-radius: 7px;
    background: #28c8ff;
    color: #001018;
    font-weight: bold;
}

.detail-button:hover { background: #ffe000; }

/* POPUP */
.popup-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: #000c;
    z-index: 3000;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.popup {
    width: 550px;
    max-width: 95%;
    max-height: 90vh;
    overflow: auto;
    background: #0b1016;
    border: 2px solid #ffe000;
    border-radius: 17px;
    padding: 22px;
}

.popup-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 15px;
}

.popup-title h2 { color: #ffe000; }

.close-button {
    flex-shrink: 0;
    width: 35px;
    height: 35px;
    border: 0;
    border-radius: 50%;
    background: #222;
    color: white;
    font-size: 20px;
}

/* สไตล์ป๊อปอัพรายละเอียดไอดี */
.detail-content-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 15px;
}

.detail-image-box {
    width: 100%;
    height: 200px;
    background: #080b0f;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    border: 1px solid #333;
}

.detail-image-box img {
    width: 100%;
    height: 100%;
    object-fit: fill;
}

.detail-info-box {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.info-row {
    background: #111820;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.info-row span:first-child { color: #aaa; font-size: 14px; }
.info-row span:last-child { color: #28c8ff; font-weight: bold; font-size: 16px; }

.popup-price-tag {
    background: #111;
    border: 1px solid #28c8ff;
    border-radius: 10px;
    text-align: center;
    padding: 12px;
    margin-bottom: 15px;
}

.popup-price-tag .p-label { color: #aaa; font-size: 13px; }
.popup-price-tag .p-val { color: #28ff55; font-size: 24px; font-weight: bold; margin-top: 3px; }

.popup-features {
    background: #111820;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 12px 15px;
    margin-bottom: 15px;
    color: #ccc;
    font-size: 14px;
    line-height: 1.6;
}

.popup-features b { color: #28c8ff; display: block; margin-bottom: 5px; }

.contact-buy {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    background: #28c8ff;
    color: #001018;
    font-weight: bold;
    font-size: 16px;
}
.contact-buy:hover { background: #ffe000; }

/* IMAGE ZOOM / LIGHTBOX */
.zoom-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    z-index: 5000;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.zoom-modal img {
    max-width: 90vw;
    max-height: 85vh;
    border: 2px solid #ffe000;
    border-radius: 10px;
    box-shadow: 0 0 25px rgba(255, 224, 0, 0.3);
    object-fit: contain;
}

.zoom-close {
    position: absolute;
    top: 20px;
    right: 25px;
    color: #ffe000;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
    line-height: 1;
}

.zoom-close:hover {
    color: #28c8ff;
}

/* CONTACT */
.contact-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px;
    margin-bottom: 10px;
    background: #111820;
    border: 1px solid #333;
    border-radius: 10px;
    color: white;
    text-decoration: none;
}

.contact-item:hover { border-color: #28c8ff; }

.contact-icon {
    width: 45px;
    height: 45px;
    flex-shrink: 0;
    border-radius: 50%;
    background: #ffe000;
    color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
}

/* GAME PAGES */
.game-page {

    width: 1100px;
    max-width: 94%;
    margin: 40px auto 70px
