<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PES Card Viewer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .id-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .id-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }

        /* Fixed image stretching here */
        .id-card .id-image {
            width: 100%;
            height: 320px;
            overflow: hidden;
            background-color: #020617;
        }

        .id-card .id-image img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Corrected from fill to maintain aspect ratio */
            object-position: center;
            transition: transform 0.3s;
        }

        .id-card:hover .id-image img {
            transform: scale(1.05);
        }

        .card-info {
            padding: 16px;
        }

        .card-info h3 {
            font-size: 1.25rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .card-info p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        /* Detail Modal Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1e293b;
            border-radius: 20px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            border: 1px solid #475569;
        }

        /* Fixed popup image stretching here */
        .detail-image-box {
            width: 100%;
            height: 300px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #020617;
            margin-bottom: 16px;
        }

        .detail-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Corrected from fill to maintain aspect ratio */
            object-position: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card-grid">
            <!-- Sample PES Card -->
            <div class="id-card">
                <div class="id-image">
                    <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=600" alt="Player Image">
                </div>
                <div class="card-info">
                    <h3>PES Player Card</h3>
                    <p>สัดส่วนสมจริง ไม่ยืดเบี้ยวแล้ว</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
