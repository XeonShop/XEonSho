<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PES Store | XeonEria</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        font-family: Arial, Tahoma, sans-serif;
        background-color: #050505;
        color: #ffffff;
        padding: 30px 20px;
    }
    .container {
        max-width: 1100px;
        margin: 0 auto;
    }
    h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #ffe000;
        font-size: 32px;
    }
    .id-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
    }
    .id-card {
        background: linear-gradient(180deg, #111, #070707);
        border: 1px solid #333;
        border-radius: 14px;
        padding: 18px;
        text-align: center;
        transition: transform 0.2s, border-color 0.2s;
    }
    .id-card:hover {
        transform: translateY(-4px);
        border-color: #ffe000;
    }
    .id-image {
        width: 100%;
        height: 190px;
        background: #000;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 14px;
        border: 1px solid #222;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .id-image img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
    .id-card h3 {
        font-size: 20px;
        margin-bottom: 6px;
        color: #fff;
    }
    .id-card p {
        color: #999;
        font-size: 14px;
        margin-bottom: 8px;
    }
    .id-price {
        color: #ffe000;
        font-size: 19px;
        font-weight: bold;
        margin-bottom: 12px;
    }
    .buy-btn {
        width: 100%;
        padding: 11px;
        border: 0;
        border-radius: 8px;
        background: #28c8ff;
        color: #001018;
        font-weight: bold;
        cursor: pointer;
        font-size: 15px;
        transition: background 0.2s;
    }
    .buy-btn:hover {
        background: #ffe000;
    }
</style>
</head>
<body>

<div class="container">
    <h1>🎮 รายการไอดี PES</h1>
    <div class="id-grid" id="pesGrid"></div>
</div>

<script>
/* ==========================================================
   ส่วนที่คุณสามารถเข้ามาแก้ไขข้อมูลเองได้ตามต้องการ
   ========================================================== */

// 1. กำหนดรูปภาพของแต่ละเบอร์ (ถ้าเบอร์ไหนไม่ใส่ จะแสดงรูปสำรองอัตโนมัติ)
const customPesImages = {
    1: "PES 2 409.png",
    2: "PES 3 409.png",
    3: "PES 4 409.png",
    // ตัวอย่างเพิ่มรูป: 4: "ชื่อรูปของคุณ.png",
};

// 2. กำหนดราคาและรายละเอียดของแต่ละเบอร์
const pesDatabase = {
    1: { price: "409 ฿" },
    2: { price: "409 ฿" },
    3: { price: "409 ฿" },
    // ตัวอย่างเพิ่มราคา: 4: { price: "450 ฿" },
};

// รูปภาพสำรองกรณีไม่มีไฟล์รูป
const DEFAULT_IMG = "Screenshot 2026-10-22 094639.png";

// ฟังก์ชันสร้างการ์ดแสดงผลอัตโนมัติ (กำหนดจำนวนไอดีได้ เช่น 1 ถึง 30 หรือเปลี่ยนเป็น 100)
function renderPesCards() {
    const grid = document.getElementById("pesGrid");
    let html = "";

    for (let i = 1; i <= 30; i++) {
        const img = customPesImages[i] || DEFAULT_IMG;
        const price = pesDatabase[i]?.price || "สอบถามราคา";

        html += `
        <div class="id-card">
            <div class="id-image">
                <img src="${img}" alt="PES ${i}" onerror="this.src='${DEFAULT_IMG}'">
            </div>
            <h3>PES ${i}</h3>
            <p>ไอดี PES พร้อมใช้งาน</p>
            <div class="id-price">${price}</div>
            <button class="buy-btn">ดูรายละเอียด</button>
        </div>
        `;
    }
    grid.innerHTML = html;
}

// โหลดข้อมูลเมื่อเปิดหน้าเว็บ
document.addEventListener("DOMContentLoaded", renderPesCards);
</script>

</body>
</html>
