<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeonEria - PES ID Collection</title>
    <style>
        /* --- การตกแต่งพื้นฐาน (อ่านและแก้ไขง่าย) --- */
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #00ffcc;
        }

        /* การจัดวางกล่องสินค้า/ไอเทม */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ดีไซน์การ์ดแต่ละอัน */
        .card {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
        }

        .card:hover {
            border-color: #00ffcc;
            transform: translateY(-5px);
        }

        /* รูปภาพ */
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #333; /* สีพื้นหลังกรณีไม่มีรูป */
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 10px 0 5px 0;
            color: #00ffcc;
        }

        .card-desc {
            font-size: 0.9rem;
            color: #ccc;
        }
    </style>
</head>
<body>

    <h1>XeonEria (PES ID 1 - 100)</h1>

    <!-- ส่วนแสดงรายการทั้งหมด -->
    <div class="grid-container" id="pes-container"></div>

    <script>
        // ==========================================
        // 1. ตั้งค่ารูปภาพเริ่มต้น (หากยังไม่มีรูป)
        // ==========================================
        const defaultImage = "https://via.placeholder.com/200x150?text=No+Image";

        // ==========================================
        // 2. ใส่ข้อมูลรูปเฉพาะ ID ที่ต้องการ (ถ้ามี)
        // ตัวอย่าง: ถ้าต้องการเปลี่ยนรูป ID #1 หรือ #5 ให้ใส่ที่นี่
        // ==========================================
        const customImages = {
            1: "https://via.placeholder.com/200x150/00ffcc/000000?text=PES+ID+1", // รูป ID 1
            2: "https://via.placeholder.com/200x150/ff0055/ffffff?text=PES+ID+2", // รูป ID 2
            // ใส่ต่อได้ตามต้องการ เช่น  3: "ชื่อไฟล์.jpg",
        };

        // ==========================================
        // 3. ระบบสร้าง PES ID #1 ถึง #100 แบบอัตโนมัติ
        // ==========================================
        const container = document.getElementById('pes-container');

        for (let i = 1; i <= 100; i++) {
            // ดึงรูปเฉพาะที่มี หรือใช้รูปเริ่มต้น
            const imgSrc = customImages[i] || defaultImage;

            // สร้างการ์ด PES ID
            const cardHTML = `
                <div class="card">
                    <img src="${imgSrc}" alt="PES ID #${i}">
                    <div class="card-title">PES ID #${i}</div>
                    <div class="card-desc">รายละเอียด PES ID #${i}</div>
                </div>
            `;
            
            container.innerHTML += cardHTML;
        }
    </script>

</body>
</html>
